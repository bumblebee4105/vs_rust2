name: Build, Test, Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Install Rust
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux, via cross)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (macOS / Windows, native cargo)
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Locate binary
        id: bin
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            f=$(ls target/${{ matrix.target }}/release/*.exe | head -1)
          else
            f=$(find target/${{ matrix.target }}/release -maxdepth 1 -type f -perm -111 ! -name '*.d' | head -1)
          fi
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ steps.bin.outputs.path }}

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04
            target: aarch64-unknown-linux-musl
            qemu: qemu-aarch64-static
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            qemu: qemu-aarch64-static
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bin

      - name: Smoke test
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            f=$(ls bin/*.exe | head -1)
          else
            f=$(find bin -type f | head -1)
            chmod +x "$f"
          fi
          runner=""
          if [[ -n "${{ matrix.qemu }}" ]]; then
            sudo apt-get update && sudo apt-get install -y qemu-user-static
            runner="${{ matrix.qemu }}"
          fi
          $runner "$f" --version || $runner "$f" --help

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Package
        run: |
          mkdir dist
          for d in bins/bin-*; do
            target=${d#bins/bin-}
            f=$(find "$d" -type f | head -1)
            name=app-$target
            if [[ "$f" == *.exe ]]; then
              cp "$f" "dist/$name.exe"
              (cd dist && 7z a "$name.zip" "$name.exe" && rm "$name.exe")
            else
              cp "$f" "dist/$name"
              chmod +x "dist/$name"
              tar -czf "dist/$name.tar.gz" -C dist "$name"
              rm "dist/$name"
            fi
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*