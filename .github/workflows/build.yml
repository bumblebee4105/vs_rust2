name: Build

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name=app-${{ matrix.target }}
          mkdir dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # on Windows the binary is the only .exe cargo produces here
            cp target/${{ matrix.target }}/release/*.exe dist/
            cd dist && 7z a "../$name.zip" . && cd ..
          else
            # on Linux/macOS: the binary is the only executable file (skip .d dep files)
            bin=$(find target/${{ matrix.target }}/release -maxdepth 1 -type f -perm -111 ! -name '*.d' | head -1)
            cp "$bin" dist/
            tar -czf "$name.tar.gz" -C dist .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz